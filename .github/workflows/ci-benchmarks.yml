name: Scheduled benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m evaluation.benchmark
