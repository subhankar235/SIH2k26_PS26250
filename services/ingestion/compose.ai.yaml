name: civilian-relief-ai
services:
  ollama:
    image: ollama/ollama@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    ports:
      - '127.0.0.1:11434:11434'
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - models:/root/.ollama
    mem_limit: 3g
    cpus: 2
volumes:
  models:
