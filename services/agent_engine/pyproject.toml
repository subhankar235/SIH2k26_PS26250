[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "air-operations-agent-engine"
version = "0.1.0"
description = "MAGI Multi-Agent Consortium and Operations Research Engine for Air Operations"
authors = [{ name = "SIH26250 Team" }]
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "aiokafka>=0.12.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

